name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - name: Build
        run: make linux

      - uses: actions/upload-artifact@v7
        with:
          name: photo_labeler-linux
          path: build/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Create build directory
        run: mkdir build

      - name: Download ImageMagick
        run: |
          curl -L https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-29/ImageMagick-7.1.2-29-portable-Q16-x64.7z -o magick.7z
          7z e magick.7z magick.exe -obuild
          del magick.7z

      - name: Build
        run: |
          dart pub get
          dart compile exe src/photo_labeler.dart -o build/photo_labeler.exe

      - uses: actions/upload-artifact@v7
        with:
          name: photo_labeler-windows
          path: build/

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: photo_labeler-linux
          path: photo_labeler-linux

      - uses: actions/download-artifact@v7
        with:
          name: photo_labeler-windows
          path: photo_labeler-windows

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            photo_labeler-linux/*
            photo_labeler-windows/*
